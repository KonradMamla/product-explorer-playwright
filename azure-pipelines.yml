trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly regression
    branches:
      include:
        - main
    always: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI: 'true'

stages:
  - stage: Smoke
    condition: eq(variables['Build.Reason'], 'IndividualCI')
    jobs:
      - job: SmokeTests
        displayName: 'Smoke Tests'
        timeoutInMinutes: 15
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - task: Cache@2
            inputs:
              key: 'playwright | chromium | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                playwright | chromium | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.cache/ms-playwright
            displayName: 'Cache Playwright browsers'

          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'

          - script: npx playwright test tests/e2e/ tests/api/ --grep @smoke --project=chromium
            displayName: 'Run smoke tests'

          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              pathToPublish: 'playwright-report'
              artifactName: 'smoke-report'

  - stage: Regression
    condition: or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.Reason'], 'Schedule'))
    jobs:
      - job: RegressionShard1
        displayName: 'Regression Tests (shard 1/3)'
        timeoutInMinutes: 30
        steps:
          - template: templates/regression-steps.yml
            parameters:
              shardIndex: 1
              shardTotal: 3

      - job: RegressionShard2
        displayName: 'Regression Tests (shard 2/3)'
        timeoutInMinutes: 30
        steps:
          - template: templates/regression-steps.yml
            parameters:
              shardIndex: 2
              shardTotal: 3

      - job: RegressionShard3
        displayName: 'Regression Tests (shard 3/3)'
        timeoutInMinutes: 30
        steps:
          - template: templates/regression-steps.yml
            parameters:
              shardIndex: 3
              shardTotal: 3

  - stage: Component
    condition: or(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.Reason'], 'Schedule'))
    jobs:
      - job: ComponentTests
        displayName: 'Component Tests'
        timeoutInMinutes: 15
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps chromium firefox webkit
            displayName: 'Install Playwright browsers'

          - script: npm run test:component
            displayName: 'Run component tests'

          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              pathToPublish: 'playwright-ct-report'
              artifactName: 'component-report'