parameters:
  - name: shardIndex
    type: number
  - name: shardTotal
    type: number

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - task: Cache@2
    inputs:
      key: 'playwright | all | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        playwright | all | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.cache/ms-playwright
    displayName: 'Cache Playwright browsers'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  - script: npx playwright test tests/e2e/ tests/api/ --shard=${{ parameters.shardIndex }}/${{ parameters.shardTotal }}
    displayName: 'Run E2E and API tests (shard ${{ parameters.shardIndex }}/${{ parameters.shardTotal }})'

  - task: PublishBuildArtifacts@1
    condition: failed()
    inputs:
      pathToPublish: 'playwright-report'
      artifactName: 'regression-report-shard-${{ parameters.shardIndex }}'